<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jookyoung Lee: Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>Analysis of the code behind this website.</p>

    <div style="display: flex; align-items: baseline;">
        <label style="width: 100%;">
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100" style="width: 100%;" />
            <time id="commit-time" style="margin-left: auto; display: block; text-align: right;"></time>
        </label>
    </div>

    <dl id="files"></dl>

    <h2>Summary</h2>
    <div id="stats"></div>

    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <h2>Commits by time of day</h2>
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
            <dl id="commit-tooltip" class="info tooltip" hidden>
                <dt>Commit</dt>
                <dd><a href="" id="commit-link" target="_blank"></a></dd>
                <dt>Date</dt>
                <dd id="commit-date"></dd>
                <dt>Time</dt>
                <dd id="commit-time-tooltip"></dd>
                <dt>Author</dt>
                <dd id="commit-author"></dd>
                <dt>Lines edited</dt>
                <dd id="commit-lines"></dd>
            </dl>
        </div>
    </div>
</body>
</html>
